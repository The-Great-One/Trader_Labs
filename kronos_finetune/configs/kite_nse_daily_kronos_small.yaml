# Kronos-small fine-tune config for Kite/NSE daily OHLCV data.
# Generate data first:
#   python scripts/export_kite_to_kronos_csv.py \
#     --output-dir kronos_finetune/data \
#     --output-name kite_nse_daily_kronos.csv
#
# Run from external/Kronos/finetune_csv after installing Kronos requirements:
#   python train_sequential.py --config ../../kronos_finetune/configs/kite_nse_daily_kronos_small.yaml

# NOTE: Kronos finetune_csv uses ratio splits internally. The exported CSV also
# includes split metadata columns for auditability; do not randomize rows.

data:
  data_path: "../../kronos_finetune/data/kite_nse_daily_kronos.csv"
  lookback_window: 512
  predict_window: 5
  max_context: 512
  clip: 5.0
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

training:
  tokenizer_epochs: 5
  basemodel_epochs: 5
  batch_size: 16
  log_interval: 25
  num_workers: 2
  seed: 42

  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000001

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 1

model_paths:
  # Hugging Face model IDs; Kronos loaders can fetch these if auth/cache is ready.
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-small"

  exp_name: "kite_nse_daily_kronos_small"
  base_path: "../../kronos_finetune/finetuned"
  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kite_nse_daily_kronos_small"
  description: "Fine-tune Kronos-small on Kite/NSE daily OHLCV data for Auto_Trader research overlays."
  use_comet: false
  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: false
  device_id: 0
